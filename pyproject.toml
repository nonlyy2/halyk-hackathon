[project]
name = "covenant-agent"
version = "0.1.0"
description = "Reads dirty corporate-loan documents and decides whether each financial covenant is breached"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pypdfium2>=4.30",
    "pillow>=10.0",
    "pandas>=2.2",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]

[project.scripts]
covenant = "covenant.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/covenant"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.7"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
